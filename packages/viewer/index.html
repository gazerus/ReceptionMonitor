<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SET Reception — Live</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #111; }

        animation: doorbell-flash 0.5s ease-in-out infinite;
      }
