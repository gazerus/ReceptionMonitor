<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SET Reception — Live</title>
    <style>
      /*
       * Mobile browsers size 100%/100vh against the largest possible
       * viewport (address bar hidden), not what's actually visible right
       * now -- causing the bottom controls to trail off below the fold
       * whenever the address bar is showing. 100dvh tracks the real,
       * currently-visible viewport instead; the 100% rule stays as a
       * fallback for browsers that don't support dvh yet.
       */
      html, body, #root { height: 100%; height: 100dvh; margin: 0; background: #111; }
      body { font-family: system-ui, sans-serif; }
      @keyframes doorbell-flash {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(2.2) saturate(1.5); }
      }
      .doorbell-flash {
        animation: doorbell-flash 0.5s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
